services:
  postgres:
    image: postgres:16-alpine
    container_name: justeat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: justeat
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d justeat"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: justeat-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/justeat
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: